<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة المذاكرة | المهندس 3LI</title>
<style>
  :root {
    --bg: #000000;
    --bg2: #0a0a0a;
    --card: #121212;
    --card2: #181818;
    --accent: #6c8cff;
    --accent2: #a06cff;
    --text: #ffffff;
    --muted: #888888;
    --border: #222222;
    --modal-bg: #0a0a0a;
    --correct: #2e7d32;
    --wrong: #c62828;
  }

  [data-theme="light"] {
    --bg: #f4f6fc;
    --bg2: #ffffff;
    --card: #ffffff;
    --card2: #f0f3ff;
    --accent: #4a6cf7;
    --accent2: #7b4aff;
    --text: #1a1d2e;
    --muted: #626880;
    --border: #e2e7f5;
    --modal-bg: #ffffff;
    --correct: #4caf50;
    --wrong: #ef5350;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .logo-badge {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, #ffb347, #ffcc00);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #000000;
    box-shadow: 0 4px 15px rgba(255,204,0,.3);
  }
  .logo-text b { display: block; font-size: 16px; }
  .logo-text span { font-size: 12px; color: var(--muted); }

  .header-actions { display: flex; align-items: center; gap: 10px; }
  .btn-action {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 8px 14px; border-radius: 20px;
    cursor: pointer; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-action:hover { border-color: var(--accent); }

  .btn-rate {
    background: linear-gradient(135deg, #ffb347, #ffcc00);
    color: #000000; font-weight: 700; padding: 8px 16px; border-radius: 20px;
    border: none; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px;
  }
  .btn-rate:hover { transform: scale(1.03); }

  main { flex: 1; max-width: 1000px; width: 100%; margin: 0 auto; padding: 36px 20px 60px; }

  .crumbs { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 24px; align-items: center; }
  .crumbs span.sep { opacity: .5; }
  .crumbs span.crumb-link { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .crumbs span.crumb-link:hover { color: #ffcc00; }
  .crumbs .active { color: var(--accent); font-weight: 600; cursor: default; text-decoration: none; }

  h1.title { font-size: 26px; margin-bottom: 6px; }
  p.subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px 20px; cursor: pointer;
    display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
  }
  .card:hover { transform: translateY(-4px); border-color: #ffcc00; box-shadow: 0 10px 25px rgba(255,204,0,.15); }
  .card .icon { font-size: 24px; }
  .card .name { font-size: 16px; font-weight: 700; }
  .card .desc { font-size: 12.5px; color: var(--muted); line-height: 1.7; }

  /* ===== أسئلة الاختيارات التفاعلية (MCQ) ===== */
  .quiz-header {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border: 1px solid var(--border);
    padding: 16px 20px; border-radius: 14px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
  }
  .quiz-score { font-weight: 700; color: #ffcc00; font-size: 15px; }
  .btn-reset {
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13.5px; font-weight: 600;
  }
  .btn-reset:hover { border-color: #ffcc00; color: #ffcc00; }

  .q-code {
    background: #000; border: 1px solid var(--border); padding: 12px;
    border-radius: 8px; font-family: monospace; color: #ffcc00; dir: ltr; text-align: left;
  }
  .q-options { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .opt-btn {
    background: var(--card2); border: 1px solid var(--border);
    color: var(--text); padding: 12px 18px; border-radius: 10px;
    cursor: pointer; text-align: right; font-size: 14.5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  [dir="ltr"] .opt-btn { text-align: left; }
  .opt-btn:hover:not(.disabled) { border-color: #ffcc00; background: var(--card); }
  .opt-btn.correct { background: var(--correct) !important; color: #fff !important; border-color: var(--correct) !important; }
  .opt-btn.wrong { background: var(--wrong) !important; color: #fff !important; border-color: var(--wrong) !important; }
  .opt-btn.disabled { cursor: default; }

  /* ===== أسئلة الإجابات القصيرة والطويلة ===== */
  .quiz-container { display: flex; flex-direction: column; gap: 24px; }
  .q-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px;
  }
  .q-title { font-size: 17px; font-weight: 700; line-height: 1.5; color: #ffcc00; dir: ltr; text-align: left; }
  .q-sub { font-size: 14.5px; color: var(--muted); line-height: 1.6; margin-top: -8px; }
  
  .question-image-box {
    width: 100%; border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; background: #000; text-align: center; padding: 10px;
  }
  .question-image-box img {
    max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto;
  }

  .answer-box {
    background: var(--card2); border-right: 4px solid var(--accent);
    padding: 16px; border-radius: 8px; font-size: 14.5px; line-height: 1.8;
  }
  .answer-en { dir: ltr; text-align: left; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .answer-ar { dir: rtl; text-align: right; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 8px; }

  .explanation-box {
    background: rgba(108, 140, 255, 0.05); border-right: 4px solid #ffcc00;
    padding: 16px; border-radius: 8px; font-size: 13.5px; line-height: 1.7;
  }
  .exp-en { dir: ltr; text-align: left; color: var(--text); margin-bottom: 10px; }
  .exp-ar { dir: rtl; text-align: right; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 10px; }

  .soon-box {
    margin-top: 30px; background: var(--card); border: 1px dashed var(--border);
    border-radius: 16px; padding: 50px 20px; text-align: center;
  }
  .soon-box .emoji { font-size: 40px; margin-bottom: 12px; }
  .soon-box h2 { font-size: 20px; margin-bottom: 8px; }
  .soon-box p { color: var(--muted); font-size: 14px; }

  .btn {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; cursor: pointer; font-size: 14px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .back { margin-top: 26px; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,.8); backdrop-filter: blur(4px);
    display: none; justify-content: center; align-items: center; z-index: 100;
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background: var(--modal-bg); border: 1px solid var(--border); border-radius: 20px;
    width: 90%; max-width: 600px; height: 80vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-header {
    padding: 16px 20px; background: var(--card2); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h3 { font-size: 16px; color: var(--text); }
  .close-modal { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .modal-body { flex: 1; }
  .modal-body iframe { width: 100%; height: 100%; border: none; }

  footer {
    background: var(--bg2); border-top: 1px solid var(--border);
    padding: 26px 28px; font-size: 12.5px; color: var(--muted); line-height: 1.9;
  }
  footer .foot-inner { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  footer .disclaimer b { color: #ffb347; }
  footer .copy {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    border-top: 1px solid var(--border); padding-top: 14px; align-items: center;
  }
  footer .copy .brand { color: #ffcc00; font-weight: 700; }
</style>
</head>

let userAnswers = {};
let state = { subject:null, nature:null, exam:null, pattern:null };

function openModal(){ document.getElementById('rateModal').classList.add('active'); }
function closeModal(){ document.getElementById('rateModal').classList.remove('active'); }

const view = document.getElementById('view');
const crumbsEl = document.getElementById('crumbs');
function goHome(){ state = {subject:null,nature:null,exam:null,pattern:null}; render(); }

function renderCrumbs(){
  const t = i18n[currentLang];
  const c = [];
  
  if (!state.subject) {
    c.push(`<span class="active">${t.home}</span>`);
  } else {
    c.push(`<span class="crumb-link" onclick="goHome()">${t.home}</span>`);
  }

  if (state.subject) {
    const s = subjects.find(x => x.id === state.subject);
    if (!state.nature) {
      c.push(`<span class="sep">›</span><span class="active">${s.name[currentLang]}</span>`);
    } else {
      c.push(`<span class="sep">›</span><span class="crumb-link" onclick="backTo('nature')">${s.name[currentLang]}</span>`);
    }
  }

  if (state.nature) {
    const natureName = state.nature === 'theory' ? t.theory : t.practical;
    if (!state.exam) {
      c.push(`<span class="sep">›</span><span class="active">${natureName}</span>`);
    } else {
      c.push(`<span class="sep">›</span><span class="crumb-link" onclick="backTo('exam')">${natureName}</span>`);
    }
  }

  if (state.exam) {
    let examName = state.exam.toUpperCase();
    if (!state.pattern) {
      c.push(`<span class="sep">›</span><span class="active">${examName}</span>`);
    } else {
      c.push(`<span class="sep">›</span><span class="crumb-link" onclick="backTo('pattern')">${examName}</span>`);
    }
  }

  if (state.pattern) {
    const p = patterns.find(x => x.id === state.pattern);
    c.push(`<span class="sep">›</span><span class="active">${p.name[currentLang]}</span>`);
  }

  crumbsEl.innerHTML = c.join('');
}

function render(){
  renderCrumbs();
  if(!state.subject) return renderSubjects();
  if(!state.nature)  return renderNatures();
  if(!state.exam)    return renderExams();
  if(!state.pattern) return renderPatterns();
  
  const key = `${state.subject}_${state.nature}_${state.exam}_${state.pattern}`;
  if(quizData[key]){
    if(state.pattern === 'mcq') {
      renderQuizMCQ(quizData[key]);
    } else {
      renderQuestionsList(quizData[key]);
    }
  } else {
    renderSoon();
  }
}

function cardHTML(id, icon, name, desc, onClick){
  return `<div class="card" onclick="${onClick}"><div class="icon">${icon}</div><div class="name">${name}</div>${desc?`<div class="desc">${desc}</div>`:''}</div>`;
}

function renderSubjects(){
  const t = i18n[currentLang];
  view.innerHTML = `<h1 class="title">${t.selectSubjectTitle}</h1><p class="subtitle">${t.selectSubjectSub}</p><div class="grid">${subjects.map(s=>cardHTML(s.id,s.icon,s.name[currentLang],s.desc[currentLang],`selectSubject('${s.id}')`)).join('')}</div>`;
}

function renderNatures(){
  const t = i18n[currentLang];
  if(state.subject === 'stats'){ state.nature = 'theory'; return renderExams(); }
  const natures = [{id:'practical', name:t.practical, icon:'🛠️'}, {id:'theory', name:t.theory, icon:'📚'}];
  view.innerHTML = `<h1 class="title">${t.natureTitle}</h1><p class="subtitle">${t.natureSub}</p><div class="grid">${natures.map(n=>cardHTML(n.id,n.icon,n.name,'',`selectNature('${n.id}')`)).join('')}</div><button class="btn back" onclick="goHome()">${t.backHome}</button>`;
}

function renderExams(){
  const t = i18n[currentLang];
  let currentExams = (state.subject === 'stats') ? [{id:'midterm1', name:'Midterm 1', icon:'📝'},{id:'midterm2', name:'Midterm 2', icon:'📝'},{id:'final', name:'Final', icon:'🎯'}] : (state.nature === 'practical' ? [{id:'final', name:'Final', icon:'🎯'}] : [{id:'midterm', name:'Midterm', icon:'📝'},{id:'final', name:'Final', icon:'🎯'}]);
  view.innerHTML = `<h1 class="title">${t.examTitle}</h1><p class="subtitle">${t.examSub}</p><div class="grid">${currentExams.map(e=>cardHTML(e.id,e.icon,e.name,'',`selectExam('${e.id}')`)).join('')}</div><button class="btn back" onclick="backTo('nature')">${t.back}</button>`;
}

function renderPatterns(){
  const t = i18n[currentLang];
  view.innerHTML = `<h1 class="title">${t.patternTitle}</h1><p class="subtitle">${t.patternSub}</p><div class="grid">${patterns.map(p=>cardHTML(p.id,p.icon,p.name[currentLang],'',`selectPattern('${p.id}')`)).join('')}</div><button class="btn back" onclick="backTo('exam')">${t.back}</button>`;
}

/* عرض أسئلة الاختيارات التفاعلية (MCQ) */
function renderQuizMCQ(questions){
  const t = i18n[currentLang];
  const sName = subjects.find(x=>x.id===state.subject).name[currentLang];
  
  let html = `<h1 class="title">${sName}</h1><p class="subtitle">اختبار تجريبي تفاعلي • ${questions.length} أسئلة</p>`;
  
  html += `
    <div class="quiz-header">
      <div class="quiz-score" id="score-counter">${t.scoreText} 0 / ${questions.length}</div>
      <button class="btn-reset" onclick="resetQuiz()">${t.resetBtn}</button>
    </div>
    <div class="quiz-container">
  `;
  
  questions.forEach((q, qIndex) => {
    html += `
      <div class="q-card" id="qc-${qIndex}">
        <div class="q-title">${q.q}</div>
        <div class="q-sub">${q.qAr}</div>
        ${q.code ? `<pre class="q-code"><code>${q.code}</code></pre>` : ''}
        <div class="q-options">
          ${q.options.map((opt, oIndex) => `
            <button class="opt-btn" id="btn-${qIndex}-${oIndex}" onclick="checkAnswer(${qIndex}, ${oIndex},${q.ans})">
              <span>${opt.txt}</span>
              <span style="font-size:12px; opacity:0.8;">${opt.ar}</span>
            </button>
          `).join('')}
        </div>
      </div>
    `;
  });
  
  html += `</div><button class="btn back" onclick="backTo('pattern')">${t.back}</button>`;
  view.innerHTML = html;
  
  userAnswers = {};
  updateScore(questions.length);
}

function checkAnswer(qIdx, selectedIdx, correctIdx) {
  if (userAnswers[qIdx] !== undefined) return;
  
  userAnswers[qIdx] = (selectedIdx === correctIdx);
  const card = document.getElementById(`qc-${qIdx}`);
  const btns = card.querySelectorAll('.opt-btn');
  
  btns.forEach((btn, idx) => {
    btn.classList.add('disabled');
    if(idx === correctIdx) {
      btn.classList.add('correct');
    } else if(idx === selectedIdx) {
      btn.classList.add('wrong');
    }
  });
  
  const quizKey = `${state.subject}_${state.nature}_${state.exam}_${state.pattern}`;
  updateScore(quizData[quizKey].length);
}

function updateScore(total) {
  const t = i18n[currentLang];
  const correctCount = Object.values(userAnswers).filter(v => v === true).length;
  const scoreEl = document.getElementById('score-counter');
  if (scoreEl) {
    scoreEl.innerText = `${t.scoreText} ${correctCount} / ${total}`;
  }
}

function resetQuiz() {
  userAnswers = {};
  const quizKey = `${state.subject}_${state.nature}_${state.exam}_${state.pattern}`;
  const questions = quizData[quizKey];
  
  questions.forEach((q, qIndex) => {
    const card = document.getElementById(`qc-${qIndex}`);
    if (card) {
      const btns = card.querySelectorAll('.opt-btn');
      btns.forEach((btn, oIndex) => {
        btn.className = 'opt-btn';
        btn.onclick = () => checkAnswer(qIndex, oIndex, q.ans);
      });
    }
  });
  
  updateScore(questions.length);
}

/* عرض أسئلة المقالي والإجابات القصيرة (Short/Long) */
function renderQuestionsList(questions){
  const t = i18n[currentLang];
  const sName = subjects.find(x=>x.id===state.subject).name[currentLang];
  const pName = patterns.find(x=>x.id===state.pattern).name[currentLang];
  
  let html = `<h1 class="title">${sName}</h1><p class="subtitle">${pName} • عدد الأسئلة: ${questions.length}</p><div class="quiz-container">`;
  
  questions.forEach((q) => {
    html += `
      <div class="q-card">
        <div class="q-title">${q.titleEn}</div>
        <div class="q-sub">${q.titleAr}</div>
        
        ${q.imageSrc ? `
          <div class="question-image-box">
            <img src="${q.imageSrc}" alt="رسمة السؤال">
          </div>
        ` : ''}
        
        ${q.ansEn ? `
          <div class="answer-box">
            <div class="answer-en"><strong>Answer:</strong><br>${q.ansEn}</div>
            <div class="answer-ar">${q.ansAr}</div>
          </div>
        ` : ''}
        
        ${q.expEn ? `
          <div class="explanation-box">
            <div class="exp-en"><strong>Explanation / Notes:</strong><br>${q.expEn}</div>
            <div class="exp-ar">${q.expAr}</div>
          </div>
        ` : ''}
      </div>
    `;
  });
  
  html += `</div><button class="btn back" onclick="backTo('pattern')">${t.back}</button>`;
  view.innerHTML = html;
}

function renderSoon(){
  const t = i18n[currentLang];
  view.innerHTML = `<h1 class="title">${t.soonTitle}</h1><div class="soon-box"><div class="emoji">🚧</div><h2>${t.soonTitle}</h2><p>${t.soonDesc}</p></div><button class="btn back" onclick="backTo('pattern')">${t.back}</button>`;
}

function selectSubject(id){ state.subject=id; render(); }
function selectNature(id){ state.nature=id; render(); }
function selectExam(id){ state.exam=id; render(); }
function selectPattern(id){ state.pattern=id; render(); }

function backTo(level){
  if(level==='nature'){ state.nature=null; state.exam=null; state.pattern=null; if(state.subject==='stats') state.subject=null; }
  if(level==='exam'){ state.exam=null; state.pattern=null; }
  if(level==='pattern'){ state.pattern=null; }
  render();
}

render();
</script>
</body>
