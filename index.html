<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة المذاكرة | المهندس 3LI</title>
<style>
  :root {
    --bg: #000000;
    --bg2: #0a0a0a;
    --card: #121212;
    --card2: #181818;
    --accent: #6c8cff;
    --accent2: #a06cff;
    --text: #ffffff;
    --muted: #888888;
    --border: #222222;
    --modal-bg: #0a0a0a;
    --correct: #2e7d32;
    --wrong: #c62828;
  }

  [data-theme="light"] {
    --bg: #f4f6fc;
    --bg2: #ffffff;
    --card: #ffffff;
    --card2: #f0f3ff;
    --accent: #4a6cf7;
    --accent2: #7b4aff;
    --text: #1a1d2e;
    --muted: #626880;
    --border: #e2e7f5;
    --modal-bg: #ffffff;
    --correct: #4caf50;
    --wrong: #ef5350;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .logo-badge {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, #ffb347, #ffcc00);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #000000;
    box-shadow: 0 4px 15px rgba(255,204,0,.3);
  }
  .logo-text b { display: block; font-size: 16px; }
  .logo-text span { font-size: 12px; color: var(--muted); }

  .header-actions { display: flex; align-items: center; gap: 10px; }
  .btn-action {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 8px 14px; border-radius: 20px;
    cursor: pointer; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-action:hover { border-color: var(--accent); }

  .btn-rate {
    background: linear-gradient(135deg, #ffb347, #ffcc00);
    color: #000000; font-weight: 700; padding: 8px 16px; border-radius: 20px;
    border: none; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px;
  }
  .btn-rate:hover { transform: scale(1.03); }

  main { flex: 1; max-width: 1000px; width: 100%; margin: 0 auto; padding: 36px 20px 60px; }

  .crumbs { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 24px; align-items: center; }
  .crumbs span.sep { opacity: .5; }
  .crumbs span.crumb-link { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .crumbs span.crumb-link:hover { color: #ffcc00; }
  .crumbs .active { color: var(--accent); font-weight: 600; cursor: default; text-decoration: none; }

  h1.title { font-size: 26px; margin-bottom: 6px; }
  p.subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px 20px; cursor: pointer;
    display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
  }
  .card:hover { transform: translateY(-4px); border-color: #ffcc00; box-shadow: 0 10px 25px rgba(255,204,0,.15); }
  .card .icon { font-size: 24px; }
  .card .name { font-size: 16px; font-weight: 700; }
  .card .desc { font-size: 12.5px; color: var(--muted); line-height: 1.7; }

  /* ===== أسئلة الاختيارات التفاعلية (MCQ) ===== */
  .quiz-header {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border: 1px solid var(--border);
    padding: 16px 20px; border-radius: 14px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
  }
  .quiz-score { font-weight: 700; color: #ffcc00; font-size: 15px; }
  .btn-reset {
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13.5px; font-weight: 600;
  }
  .btn-reset:hover { border-color: #ffcc00; color: #ffcc00; }

  .q-code {
    background: #000; border: 1px solid var(--border); padding: 12px;
    border-radius: 8px; font-family: monospace; color: #ffcc00; dir: ltr; text-align: left;
  }
  .q-options { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .opt-btn {
    background: var(--card2); border: 1px solid var(--border);
    color: var(--text); padding: 12px 18px; border-radius: 10px;
    cursor: pointer; text-align: right; font-size: 14.5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  [dir="ltr"] .opt-btn { text-align: left; }
  .opt-btn:hover:not(.disabled) { border-color: #ffcc00; background: var(--card); }
  .opt-btn.correct { background: var(--correct) !important; color: #fff !important; border-color: var(--correct) !important; }
  .opt-btn.wrong { background: var(--wrong) !important; color: #fff !important; border-color: var(--wrong) !important; }
  .opt-btn.disabled { cursor: default; }

  /* ===== أسئلة الإجابات القصيرة والطويلة ===== */
  .quiz-container { display: flex; flex-direction: column; gap: 24px; }
  .q-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px;
  }
  .q-title { font-size: 17px; font-weight: 700; line-height: 1.5; color: #ffcc00; dir: ltr; text-align: left; }
  .q-sub { font-size: 14.5px; color: var(--muted); line-height: 1.6; margin-top: -8px; }
  
  .question-image-box {
    width: 100%; border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; background: #000; text-align: center; padding: 10px;
    position: relative;
  }
  .question-image-box img {
    max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto;
    cursor: zoom-in; transition: transform 0.2s ease;
  }
  .question-image-box img:hover {
    transform: scale(1.02);
  }

  /* تنسيق عرض صورتين بجانب بعض لـ Q7 */
  .images-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
  }

  @media (max-width: 600px) {
    .images-grid-2 { grid-template-columns: 1fr; }
  }

  .btn-toggle-sol {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; padding: 12px 20px; border-radius: 12px;
    cursor: pointer; font-size: 14px; font-weight: 700; display: inline-flex;
    align-items: center; justify-content: center; gap: 8px; margin-top: 8px;
    box-shadow: 0 4px 12px rgba(108, 140, 255, 0.2);
  }
  .btn-toggle-sol:hover { opacity: 0.95; transform: translateY(-1px); }

  .hidden-sol-box {
    display: none; margin-top: 10px;
  }
  .hidden-sol-box.visible {
    display: block; animation: fadeIn 0.3s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .answer-box {
    background: var(--card2); border-right: 4px solid var(--accent);
    padding: 16px; border-radius: 8px; font-size: 14.5px; line-height: 1.8;
  }
  .answer-en { dir: ltr; text-align: left; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .answer-ar { dir: rtl; text-align: right; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 8px; }

  .explanation-box {
    background: rgba(108, 140, 255, 0.05); border-right: 4px solid #ffcc00;
    padding: 16px; border-radius: 8px; font-size: 13.5px; line-height: 1.7;
  }
  .exp-en { dir: ltr; text-align: left; color: var(--text); margin-bottom: 10px; }
  .exp-ar { dir: rtl; text-align: right; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 10px; }

  .soon-box {
    margin-top: 30px; background: var(--card); border: 1px dashed var(--border);
    border-radius: 16px; padding: 50px 20px; text-align: center;
  }
  .soon-box .emoji { font-size: 40px; margin-bottom: 12px; }
  .soon-box h2 { font-size: 20px; margin-bottom: 8px; }
  .soon-box p { color: var(--muted); font-size: 14px; }

  .btn {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; cursor: pointer; font-size: 14px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .back { margin-top: 26px; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,.8); backdrop-filter: blur(4px);
    display: none; justify-content: center; align-items: center; z-index: 100;
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background: var(--modal-bg); border: 1px solid var(--border); border-radius: 20px;
    width: 90%; max-width: 600px; height: 80vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-header {
    padding: 16px 20px; background: var(--card2); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h3 { font-size: 16px; color: var(--text); }
  .close-modal { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .modal-body { flex: 1; }
  .modal-body iframe { width: 100%; height: 100%; border: none; }

  /* ===== نافذة تكبير وتقريب الصور (Zoom / Lightbox Modal) ===== */
  .zoom-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.92); backdrop-filter: blur(8px);
    display: none; justify-content: center; align-items: center; z-index: 1000;
    flex-direction: column; overflow: hidden;
  }
  .zoom-overlay.active { display: flex; }
  
  .zoom-controls {
    position: absolute; top: 20px; display: flex; gap: 12px; z-index: 1001;
    background: rgba(20,20,20,0.8); padding: 8px 16px; border-radius: 30px;
    border: 1px solid #333;
  }
  .zoom-btn {
    background: var(--card2); color: #fff; border: 1px solid var(--border);
    width: 36px; height: 36px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 18px; font-weight: bold;
    cursor: pointer; transition: all 0.2s;
  }
  .zoom-btn:hover { background: #ffcc00; color: #000; border-color: #ffcc00; }

  .zoom-img-container {
    width: 90%; height: 85%; display: flex; justify-content: center;
    align-items: center; overflow: auto; cursor: grab;
  }
  .zoom-img-container img {
    max-width: 90%; max-height: 90%; object-fit: contain;
    transition: transform 0.15s ease-out; transform-origin: center center;
  }

  footer {
    background: var(--bg2); border-top: 1px solid var(--border);
    padding: 26px 28px; font-size: 12.5px; color: var(--muted); line-height: 1.9;
  }
  footer .foot-inner { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  footer .disclaimer b { color: #ffb347; }
  footer .copy {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    border-top: 1px solid var(--border); padding-top: 14px; align-items: center;
  }
  footer .copy .brand { color: #ffcc00; font-weight: 700; }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()">
    <div class="logo-badge">3LI</div>
    <div class="logo-text">
      <b id="txt-logo-title">المهندس 3LI</b>
      <span id="txt-logo-sub">منصة المذاكرة التفاعلية</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-action" id="langBtn" onclick="toggleLang()">🌐 English</button>
    <button class="btn-action" id="themeBtn" onclick="toggleTheme()">🌙 داكن</button>
    <button class="btn-rate" id="txt-rate-btn" onclick="openModal()">⭐ التقييم</button>
  </div>
</header>

<main>
  <div class="crumbs" id="crumbs"></div>
  <div id="view"></div>
</main>

<div class="modal-overlay" id="rateModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="txt-modal-title">⭐ تقييم منصة المذاكرة | المهندس 3LI</h3>
      <button class="close-modal" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSewO8PUyTpMNCvPX1QDVz7V_CRymhSp1vptZ9GbaZKGchbnZw/viewform?embedded=true">Loading…</iframe>
    </div>
  </div>
</div>

<!-- Lightbox Modal للتقريب والتبعيد للصور -->
<div class="zoom-overlay" id="zoomModal">
  <div class="zoom-controls">
    <button class="zoom-btn" onclick="zoomImage(1.25)" title="تقريب">+</button>
    <button class="zoom-btn" onclick="zoomImage(0.8)" title="تبعيد">-</button>
    <button class="zoom-btn" onclick="resetZoom()" title="إعادة ضبط">↺</button>
    <button class="zoom-btn" onclick="closeZoomModal()" title="إغلاق">✕</button>
  </div>
  <div class="zoom-img-container" id="zoomContainer">
    <img id="zoomedImg" src="" alt="صورة مكبرة">
  </div>
</div>

<footer>
  <div class="foot-inner">
    <div class="disclaimer" id="txt-disclaimer">
      <b>⚠️ تنبيه وإخلاء مسؤولية:</b> هذا الموقع هو جهد استرشادي وداعم للمذاكرة جرى إعداده بواسطة المهندس 3LI لمساعدة الطلاب.
    </div>
    <div class="copy">
      <span id="txt-copy">© 2026 جميع الحقوق محفوظة — <span class="brand">المهندس 3LI</span></span>
      <button class="btn-rate" id="txt-foot-rate" onclick="openModal()">⭐ شاركنا رأيك وتقييمك</button>
    </div>
  </div>
</footer>

<script>
const i18n = {
  ar: {
    logoTitle: "المهندس 3LI", logoSub: "منصة المذاكرة التفاعلية", rateBtn: "⭐ التقييم", modalTitle: "⭐ تقييم منصة المذاكرة | المهندس 3LI",
    disclaimer: "<b>⚠ تنبيه وإخلاء مسؤولية:</b> هذا الموقع هو جهد استرشادي وداعم للمذاكرة جرى إعداده بواسطة المهندس 3LI.",
    copy: "© 2026 جميع الحقوق محفوظة — <span class=\"brand\">المهندس 3LI</span>", footRate: "⭐ شاركنا رأيك وتقييمك",
    home: "الرئيسية", selectSubjectTitle: "اختر المادة", selectSubjectSub: "اختر المادة اللي تبغى تراجعها من مواد الترم الخامس",
    natureTitle: "طبيعة المادة", natureSub: "هل المادة عملي ولا نظري؟", examTitle: "نوع الاختبار", examSub: "اختر نوع الاختبار اللي تذاكر له",
    patternTitle: "نمط الأسئلة", patternSub: "اختر نمط الأسئلة اللي تبغى تتدرب عليه", soonTitle: "قريباً",
    soonDesc: "هذا القسم قيد الإعداد، بيتم إضافة الأسئلة هنا قريباً بإذن الله.", back: "↩ رجوع", backHome: "↩ رجوع للرئيسية", practical: "عملي", theory: "نظري",
    resetBtn: "🔄 إعادة الاختبار", scoreText: "النتيجة:"
  },
  en: {
    logoTitle: "Eng. 3LI", logoSub: "Interactive Study Platform", rateBtn: "⭐ Rate Us", modalTitle: "⭐ Platform Feedback | Eng. 3LI",
    disclaimer: "<b>⚠️ Disclaimer:</b> Educational study aid prepared by Eng. 3LI.",
    copy: "© 2026 All Rights Reserved — <span class=\"brand\">Eng. 3LI</span>", footRate: "⭐ Share Your Feedback",
    home: "Home", selectSubjectTitle: "Select Subject", selectSubjectSub: "Choose the course for 5th Semester",
    natureTitle: "Course Type", natureSub: "Practical or theoretical?", examTitle: "Exam Type", examSub: "Select your exam",
    patternTitle: "Question Pattern", patternSub: "Choose question style", soonTitle: "Coming Soon",
    soonDesc: "This section is under development.", back: "↩ Back", backHome: "↩ Back to Home", practical: "Practical", theory: "Theory",
    resetBtn: "🔄 Reset Quiz", scoreText: "Score:"
  }
};

let currentLang = 'ar';
function initLang() { currentLang = localStorage.getItem('lang') || 'ar'; applyLang(); }
function toggleLang() { currentLang = currentLang === 'ar' ? 'en' : 'ar'; localStorage.setItem('lang', currentLang); applyLang(); render(); }
function applyLang() {
  document.documentElement.setAttribute('lang', currentLang);
  document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
  document.getElementById('langBtn').innerText = currentLang === 'ar' ? '🌐 English' : '🌐 العربية';
  const t = i18n[currentLang];
  document.getElementById('txt-logo-title').innerText = t.logoTitle;
  document.getElementById('txt-logo-sub').innerText = t.logoSub;
  document.getElementById('txt-rate-btn').innerText = t.rateBtn;
  document.getElementById('txt-modal-title').innerText = t.modalTitle;
  document.getElementById('txt-disclaimer').innerHTML = t.disclaimer;
  document.getElementById('txt-copy').innerHTML = t.copy;
  document.getElementById('txt-foot-rate').innerText = t.footRate;
}

function initTheme() { const savedTheme = localStorage.getItem('theme') || 'dark'; document.documentElement.setAttribute('data-theme', savedTheme); updateThemeBtn(savedTheme); }
function toggleTheme() { const ct = document.documentElement.getAttribute('data-theme'); const nt = ct === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', nt); localStorage.setItem('theme', nt); updateThemeBtn(nt); }
function updateThemeBtn(t) { document.getElementById('themeBtn').innerText = t === 'light' ? '☀️ Light' : '🌙 Dark'; }
initTheme(); initLang();

const subjects = [
  {id:'circuits',   name:{ar:'دوائر كهربائية', en:'Electric Circuits'}, icon:'⚡', desc:{ar:'تحليل الدوائر والتيار والجهد', en:'Circuit Analysis'}},
  {id:'networks',   name:{ar:'شبكات الحاسب', en:'Computer Networks'}, icon:'🌐', desc:{ar:'الطبقات والبروتوكولات', en:'Layers & Protocols'}},
  {id:'signals',    name:{ar:'الإشارات والنظم', en:'Signals & Systems'}, icon:'📈', desc:{ar:'الإشارات المستمرة والمتقطعة', en:'Signals'}},
  {id:'dsa',        name:{ar:'هياكل البيانات وخوارزميات الشبكات', en:'Data Structures & Network Algorithms'}, icon:'🧩', desc:{ar:'الهياكل والخوارزميات', en:'Structures & Algorithms'}},
  {id:'stats',      name:{ar:'الإحصاء الاحتمالات', en:'Statistics & Probability'}, icon:'📊', desc:{ar:'التوزيعات والاحتمالات', en:'Probability'}},
  {id:'db',         name:{ar:'مفاهيم وتصميم قواعد البيانات', en:'Database Concepts & Design'}, icon:'🗄️', desc:{ar:'التصميم والعلاقات', en:'DB Design'}},
];

const patterns = [
  {id:'mcq',   name:{ar:'اختيارات (MCQs)', en:'Multiple Choice (MCQs)'}, icon:'🔘'},
  {id:'short', name:{ar:'إجابات قصيرة (Short Answer)', en:'Short Answer'}, icon:'✏️'},
  {id:'long',  name:{ar:'إجابات طويلة / علل (Long Answer)', en:'Long Answer'}, icon:'📄'},
];

/* ===== قاعدة البيانات الشاملة (DSA + Signals & Systems) ===== */
const quizData = {
  // ==========================================
  // === 1. إشارات ونظم (Signals & Systems) - MIDTERM THEORY ===
  // ==========================================
  "signals_theory_midterm_mcq": [
    {
      q: "Q0. Which of the following is the value of e^∞?",
      qAr: "ما هي قيمة التعبير e^∞؟",
      options: [
        {txt: "(a) 0", ar: "0"},
        {txt: "(b) ∞", ar: "ما لا نهاية"},
        {txt: "(c) 1", ar: "1"},
        {txt: "(d) -1", ar: "-1"}
      ],
      ans: 1
    },
    {
      q: "Q1. Which of the following is the value of e^0?",
      qAr: "ما هي قيمة التعبير e^0؟",
      options: [
        {txt: "(a) 0", ar: "0"},
        {txt: "(b) ∞", ar: "ما لا نهاية"},
        {txt: "(c) 1", ar: "1"},
        {txt: "(d) -1", ar: "-1"}
      ],
      ans: 2
    },
    {
      q: "Q2. Which of the following expressions represents a Right-Shift of 2 · x[n]?",
      qAr: "أي من التعابير التالية يمثل إزاحة لليمين بمقدار 2 للإشارة 2 · x[n]؟",
      options: [
        {txt: "(a) 2 · x[n-2]", ar: "2 · x[n-2]"},
        {txt: "(b) 2 · x[n/2]", ar: "2 · x[n/2]"},
        {txt: "(c) 2 · x[n+2]", ar: "2 · x[n+2]"},
        {txt: "(d) 2 · x[-n]", ar: "2 · x[-n]"}
      ],
      ans: 0
    },
    {
      q: "Q3. Time-reversal of 3 · x(t) is given as:",
      qAr: "يعكس الزمن (Time-reversal) للإشارة 3 · x(t) بالصيغة:",
      options: [
        {txt: "(a) 3 · x(t/3)", ar: "3 · x(t/3)"},
        {txt: "(b) 3 · x(-t)", ar: "3 · x(-t)"},
        {txt: "(c) x(t/3)", ar: "x(t/3)"},
        {txt: "(d) 3 · x(3t)", ar: "3 · x(3t)"}
      ],
      ans: 1

/* ===== دوال التقريب والتبعيد للصور (Zoom / Lightbox) ===== */
let currentScale = 1;
function openZoomModal(imgSrc) {
  const modal = document.getElementById('zoomModal');
  const img = document.getElementById('zoomedImg');
  img.src = imgSrc;
  currentScale = 1;
  img.style.transform = `scale(${currentScale})`;
  modal.classList.add('active');
}

function closeZoomModal() {
  document.getElementById('zoomModal').classList.remove('active');
}

function zoomImage(factor) {
  currentScale *= factor;
  if (currentScale < 0.5) currentScale = 0.5;
  if (currentScale > 4) currentScale = 4;
  document.getElementById('zoomedImg').style.transform = `scale(${currentScale})`;
}

function resetZoom() {
  currentScale = 1;
  document.getElementById('zoomedImg').style.transform = `scale(${currentScale})`;
}

    solBox.classList.remove('visible');

  } else {
    solBox.classList.add('visible');
    btn.innerHTML = '🙈 إخفاء الحل الصحيح';
  }
}

  const c = [];
  
  if (!state.subject) {
    c.push(`<span class="active">${t.home}</span>`);
  } else {
    c.push(`<span class="crumb-link" onclick="goHome()">${t.home}</span>`);
  }

  if (state.subject) {
    const s = subjects.find(x => x.id === state.subject);
    if (!state.nature) {
      c.push(`<span class="sep">›</span><span class="active">${s.name[currentLang]}</span>`);
    } else {
      c.push(`<span class="sep">›</span><span class="crumb-link" onclick="backTo('nature')">${s.name[currentLang]}</span>`);
    }
  }

  if (state.nature) {
    const natureName = state.nature === 'theory' ? t.theory : t.practical;
    if (!state.exam) {
      c.push(`<span class="sep">›</span><span class="active">${natureName}</span>`);
    } else {
      c.push(`<span class="sep">›</span><span class="crumb-link" onclick="backTo('exam')">${natureName}</span>`);
    }
  }

  if (state.exam) {
    let examName = state.exam.toUpperCase();
    if (!state.pattern) {
      c.push(`<span class="sep">›</span><span class="active">${examName}</span>`);
    } else {
      c.push(`<span class="sep">›</span><span class="crumb-link" onclick="backTo('pattern')">${examName}</span>`);
    }
  }

  if (state.pattern) {
    const p = patterns.find(x => x.id === state.pattern);
    c.push(`<span class="sep">›</span><span class="active">${p.name[currentLang]}</span>`);
  }

  crumbsEl.innerHTML = c.join('');
}

function render(){
  renderCrumbs();
  if(!state.subject) return renderSubjects();
  if(!state.nature)  return renderNatures();
  if(!state.exam)    return renderExams();
  if(!state.pattern) return renderPatterns();
  
  const key = `${state.subject}_${state.nature}_${state.exam}_${state.pattern}`;
  if(quizData[key]){
    if(state.pattern === 'mcq') {
      renderQuizMCQ(quizData[key]);
    } else {
      renderQuestionsList(quizData[key]);
    }
  } else {
    renderSoon();
  }
}

function cardHTML(id, icon, name, desc, onClick){
  return `<div class="card" onclick="${onClick}"><div class="icon">${icon}</div><div class="name">${name}</div>${desc?`<div class="desc">${desc}</div>`:''}</div>`;
}

function renderSubjects(){
  const t = i18n[currentLang];
  view.innerHTML = `<h1 class="title">${t.selectSubjectTitle}</h1><p class="subtitle">${t.selectSubjectSub}</p><div class="grid">${subjects.map(s=>cardHTML(s.id,s.icon,s.name[currentLang],s.desc[currentLang],`selectSubject('${s.id}')`)).join('')}</div>`;
}

function renderNatures(){
  const t = i18n[currentLang];
  if(state.subject === 'stats'){ state.nature = 'theory'; return renderExams(); }
  const natures = [{id:'practical', name:t.practical, icon:'🛠️'}, {id:'theory', name:t.theory, icon:'📚'}];
  view.innerHTML = `<h1 class="title">${t.natureTitle}</h1><p class="subtitle">${t.natureSub}</p><div class="grid">${natures.map(n=>cardHTML(n.id,n.icon,n.name,'',`selectNature('${n.id}')`)).join('')}</div><button class="btn back" onclick="goHome()">${t.backHome}</button>`;
}

function renderExams(){
  const t = i18n[currentLang];
  let currentExams = (state.subject === 'stats') ? [{id:'midterm1', name:'Midterm 1', icon:'📝'},{id:'midterm2', name:'Midterm 2', icon:'📝'},{id:'final', name:'Final', icon:'🎯'}] : (state.nature === 'practical' ? [{id:'final', name:'Final', icon:'🎯'}] : [{id:'midterm', name:'Midterm', icon:'📝'},{id:'final', name:'Final', icon:'🎯'}]);
  view.innerHTML = `<h1 class="title">${t.examTitle}</h1><p class="subtitle">${t.examSub}</p><div class="grid">${currentExams.map(e=>cardHTML(e.id,e.icon,e.name,'',`selectExam('${e.id}')`)).join('')}</div><button class="btn back" onclick="backTo('nature')">${t.back}</button>`;
}

function renderPatterns(){
  const t = i18n[currentLang];
  view.innerHTML = `<h1 class="title">${t.patternTitle}</h1><p class="subtitle">${t.patternSub}</p><div class="grid">${patterns.map(p=>cardHTML(p.id,p.icon,p.name[currentLang],'',`selectPattern('${p.id}')`)).join('')}</div><button class="btn back" onclick="backTo('exam')">${t.back}</button>`;
}

/* عرض أسئلة الاختيارات التفاعلية (MCQ) */
function renderQuizMCQ(questions){
  const t = i18n[currentLang];
  const sName = subjects.find(x=>x.id===state.subject).name[currentLang];
  
  let html = `<h1 class="title">${sName}</h1><p class="subtitle">اختبار تجريبي تفاعلي • ${questions.length} أسئلة</p>`;
  
  html += `
    <div class="quiz-header">
      <div class="quiz-score" id="score-counter">${t.scoreText} 0 / ${questions.length}</div>
      <button class="btn-reset" onclick="resetQuiz()">${t.resetBtn}</button>
    </div>
    <div class="quiz-container">
  `;
  
  questions.forEach((q, qIndex) => {
    html += `
      <div class="q-card" id="qc-${qIndex}">
        <div class="q-title">${q.q}</div>
        <div class="q-sub">${q.qAr}</div>
        ${q.code ? `<pre class="q-code"><code>${q.code}</code></pre>` : ''}
        <div class="q-options">
          ${q.options.map((opt, oIndex) => `
            <button class="opt-btn" id="btn-${qIndex}-${oIndex}" onclick="checkAnswer(${qIndex}, ${oIndex},${q.ans})">
              <span>${opt.txt}</span>
              <span style="font-size:12px; opacity:0.8;">${opt.ar}</span>
            </button>
          `).join('')}
        </div>
      </div>
    `;
  });
  
  html += `</div><button class="btn back" onclick="backTo('pattern')">${t.back}</button>`;
  view.innerHTML = html;
  
  userAnswers = {};
  updateScore(questions.length);
}

function checkAnswer(qIdx, selectedIdx, correctIdx) {
  if (userAnswers[qIdx] !== undefined) return;
  
  userAnswers[qIdx] = (selectedIdx === correctIdx);
  const card = document.getElementById(`qc-${qIdx}`);
  const btns = card.querySelectorAll('.opt-btn');
  
  btns.forEach((btn, idx) => {
    btn.classList.add('disabled');
    if(idx === correctIdx) {
      btn.classList.add('correct');
    } else if(idx === selectedIdx) {
      btn.classList.add('wrong');
    }
  });
  
  const quizKey = `${state.subject}_${state.nature}_${state.exam}_${state.pattern}`;
  updateScore(quizData[quizKey].length);
}

function updateScore(total) {
  const t = i18n[currentLang];
  const correctCount = Object.values(userAnswers).filter(v => v === true).length;
  const scoreEl = document.getElementById('score-counter');
  if (scoreEl) {
    scoreEl.innerText = `${t.scoreText} ${correctCount} / ${total}`;
  }
}

function resetQuiz() {
  userAnswers = {};
  const quizKey = `${state.subject}_${state.nature}_${state.exam}_${state.pattern}`;
  const questions = quizData[quizKey];
  
  questions.forEach((q, qIndex) => {
    const card = document.getElementById(`qc-${qIndex}`);
    if (card) {
      const btns = card.querySelectorAll('.opt-btn');
      btns.forEach((btn, oIndex) => {
        btn.className = 'opt-btn';
        btn.onclick = () => checkAnswer(qIndex, oIndex, q.ans);
      });
    }
  });
  
  updateScore(questions.length);
}

/* عرض أسئلة المقالي والإجابات القصيرة والطويلة (Short/Long) */
function renderQuestionsList(questions){
  const t = i18n[currentLang];
  const sName = subjects.find(x=>x.id===state.subject).name[currentLang];
  const pName = patterns.find(x=>x.id===state.pattern).name[currentLang];
  
  let html = `<h1 class="title">${sName}</h1><p class="subtitle">${pName} • عدد الأسئلة: ${questions.length}</p><div class="quiz-container">`;
  
  questions.forEach((q, idx) => {
    html += `
      <div class="q-card">
        <div class="q-title">${q.titleEn}</div>
        <div class="q-sub">${q.titleAr}</div>
        
        ${q.imageSrc ? `
          <div class="question-image-box">
            <img src="${q.imageSrc}" alt="رسمة السؤال" onclick="openZoomModal('${q.imageSrc}')">
          </div>
        ` : ''}

        ${q.twoImages ? `
          <div class="images-grid-2">
            <div class="question-image-box">
              <img src="${q.twoImages[0]}" alt="صورة 1" onclick="openZoomModal('${q.twoImages[0]}')">
            </div>
            <div class="question-image-box">
              <img src="${q.twoImages[1]}" alt="صورة 2" onclick="openZoomModal('${q.twoImages[1]}')">
            </div>
          </div>
        ` : ''}

        ${q.solImage ? `
          <div style="text-align:center;">
            <button class="btn-toggle-sol" id="btn-sol-${idx}" onclick="toggleSolution('sol-${idx}')">
              👁️ أظهر الحل الصحيح لأسئلة التدريب
            </button>
          </div>
          <div class="hidden-sol-box" id="sol-${idx}">
            <div class="question-image-box">
              <img src="${q.solImage}" alt="صورة الحل الصحيح" onclick="openZoomModal('${q.solImage}')">
            </div>
          </div>
        ` : ''}
        
        ${q.ansEn ? `
          <div class="answer-box">
            <div class="answer-en"><strong>Answer:</strong><br>${q.ansEn}</div>
            <div class="answer-ar">${q.ansAr}</div>
          </div>
        ` : ''}
        
        ${q.expEn ? `
          <div class="explanation-box">
            <div class="exp-en"><strong>Explanation / Notes:</strong><br>${q.expEn}</div>
            <div class="exp-ar">${q.expAr}</div>
          </div>
        ` : ''}
      </div>
    `;
  });
  
  html += `</div><button class="btn back" onclick="backTo('pattern')">${t.back}</button>`;
  view.innerHTML = html;
}

function renderSoon(){
  const t = i18n[currentLang];
  view.innerHTML = `<h1 class="title">${t.soonTitle}</h1><div class="soon-box"><div class="emoji">🚧</div><h2>${t.soonTitle}</h2><p>${t.soonDesc}</p></div><button class="btn back" onclick="backTo('pattern')">${t.back}</button>`;
}

function selectSubject(id){ state.subject=id; render(); }
function selectNature(id){ state.nature=id; render(); }
function selectExam(id){ state.exam=id; render(); }
function selectPattern(id){ state.pattern=id; render(); }

function backTo(level){
  if(level==='nature'){ state.nature=null; state.exam=null; state.pattern=null; if(state.subject==='stats') state.subject=null; }
  if(level==='exam'){ state.exam=null; state.pattern=null; }
  if(level==='pattern'){ state.pattern=null; }
  render();
}

render();
</script>
</body>
</html>
